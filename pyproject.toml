[project]
name = "wm-viz"
version = "0.1.0"
description = "Record → select → render: visualize wm agent episodes (Blender)"
requires-python = ">=3.11,<3.12"
dependencies = [
    "numpy>=1.26",
    "typer>=0.12",
    "rich>=13",
    "pillow>=10",
    "imageio>=2.31",
    "imageio-ffmpeg>=0.5",
]

[project.optional-dependencies]
blender = ["bpy>=5"]
figures = ["matplotlib>=3.7"]

[project.scripts]
wmviz = "wmviz.cli:app"

[dependency-groups]
dev = ["pytest>=8", "matplotlib>=3.7"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["wmviz"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: needs bpy or long renders"]
